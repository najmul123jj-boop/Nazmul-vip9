<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HGZY | Transparent Signal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', sans-serif;
            touch-action: none;
        }

        /* গেমটি ফুল স্ক্রিন থাকবে */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }

        /* প্যানেলের কালো ঘর সরিয়ে ট্রান্সপারেন্ট করা হয়েছে */
        #pureSignalPanel {
            position: fixed;
            top: 60px;
            right: 15px;
            width: 110px;
            background: transparent; /* ব্যাকগ্রাউন্ড রিমুভড */
            z-index: 999999;
            touch-action: none;
            text-align: center;
        }

        /* পাসওয়ার্ড বক্স - শুধু ইনপুট ফিল্ডটি দেখা যাবে */
        .puzzle-block {
            background: rgba(0, 0, 0, 0.6); /* হালকা আবছা ভাব যাতে ইনপুট দেখা যায় */
            border-radius: 12px;
            padding: 5px;
            border: 1px solid #ffd966aa;
        }
        
        .puzzle-block input {
            width: 100%;
            background: transparent;
            border: none;
            color: #FFE484;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            letter-spacing: 2px;
        }

        /* সিগন্যাল এরিয়া - কোন কালো ঘর নেই */
        .signal-area {
            background: transparent;
            text-align: center;
        }

        .seconds-label {
            font-size: 10px;
            color: #0ff;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .seconds-number {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan;
        }

        /* সিগন্যাল টেক্সট (BIG/SMALL) */
        .prediction-area {
            margin-top: 5px;
            font-weight: 900;
        }

        .signal-big {
            font-size: 28px;
            color: #00FFAA;
            text-shadow: 2px 2px 4px #000;
        }

        .signal-small {
            font-size: 28px;
            color: #FF4D4D;
            text-shadow: 2px 2px 4px #000;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #0ff;
            display: inline-block;
            border-radius: 50%;
            animation: pulseLoad 0.6s infinite alternate;
        }
        @keyframes pulseLoad { to { opacity: 0.2; } }

        .drag-handle {
            font-size: 8px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }
    </style>
</head>
<body>

<iframe src="https://hgnice.cc/#/register?invitationCode=511711502736"></iframe>

<div id="pureSignalPanel">
    <div id="pinBox" class="puzzle-block">
        <input type="password" id="pinCode" placeholder="PIN" inputmode="numeric" maxlength="6">
    </div>

    <div id="signalBox" style="display: none;">
        <div class="signal-area">
            <div class="seconds-label">HGZY 30s</div>
            <div id="timerNum" class="seconds-number">30</div>
            <div class="prediction-area" id="predictionBlock">
                <div class="signal-big">---</div>
            </div>
            <div class="drag-handle">:::::</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const CYCLE_SEC = 30;
        const VALID_PIN = "123456";
        
        const panel = document.getElementById('pureSignalPanel');
        const pinContainer = document.getElementById('pinBox');
        const pinInput = document.getElementById('pinCode');
        const signalContainer = document.getElementById('signalBox');
        const timerSpan = document.getElementById('timerNum');
        const predictionDiv = document.getElementById('predictionBlock');
        
        let unlocked = false;
        let lastCycleMarker = -1;

        function getRemaining() {
            const nowSec = new Date().getSeconds();
            return CYCLE_SEC - (nowSec % CYCLE_SEC);
        }

        function generateSignal() {
            predictionDiv.innerHTML = `<div class="loading-dots"><span></span><span></span><span></span></div>`;
            setTimeout(() => {
                const isBig = Math.random() > 0.5;
                predictionDiv.innerHTML = isBig ? 
                    `<div class="signal-big">BIG</div>` : 
                    `<div class="signal-small">SMALL</div>`;
            }, 1500);
        }

        function updateLogic() {
            const rem = getRemaining();
            timerSpan.innerText = rem;
            
            if (rem === CYCLE_SEC) {
                const marker = Math.floor(Date.now() / 1000 / CYCLE_SEC);
                if (lastCycleMarker !== marker) {
                    lastCycleMarker = marker;
                    generateSignal();
                }
            }
        }

        pinInput.addEventListener('input', (e) => {
            if (e.target.value === VALID_PIN) {
                unlocked = true;
                pinContainer.style.display = 'none';
                signalContainer.style.display = 'block';
                generateSignal();
                setInterval(updateLogic, 200);
            }
        });

        // ড্র্যাগ করার সুবিধা
        let isDragging = false;
        let offsetX, offsetY;

        panel.addEventListener('touchstart', (e) => {
            isDragging = true;
            offsetX = e.touches[0].clientX - panel.offsetLeft;
            offsetY = e.touches[0].clientY - panel.offsetTop;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                panel.style.left = (e.touches[0].clientX - offsetX) + 'px';
                panel.style.top = (e.touches[0].clientY - offsetY) + 'px';
                panel.style.right = 'auto';
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });
    })();
</script>

</body>
</html>
