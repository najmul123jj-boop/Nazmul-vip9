<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DKWIN 30S PREMIUM UPDATE</title>
    <style>
        :root {
            --red: #ff4d4d;
            --green: #2ecc71;
            --white: #ffffff;
            --yellow: #ffeb3b;
        }

        body { 
            margin: 0; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }
        
        iframe { 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Fixed Panel Container - Top Center */
        #fixedPanel {
            position: fixed;
            top: 15%;        
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            pointer-events: none; /* Allows clicking through empty areas */
            width: 100%;
            text-align: center;
        }

        /* Password Container - Transparent Background */
        #lock-container {
            background: transparent; /* Removed black box */
            padding: 0;
            pointer-events: auto; /* Re-enable clicking for input */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #passInput {
            width: 100px;
            background: transparent; /* Removed black box */
            border: none; /* Removed border */
            border-bottom: 2px solid var(--green); /* Minimal bottom border */
            color: var(--green);
            text-align: center;
            font-size: 20px;
            padding: 5px;
            border-radius: 0;
            outline: none;
            text-shadow: 0 0 5px var(--green);
            font-weight: bold;
        }

        #passInput::placeholder {
            color: rgba(46, 204, 113, 0.5);
            font-size: 14px;
        }

        .label-text {
            color: var(--green);
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            letter-spacing: 1px;
        }

        /* Signal Content Container - Transparent Background */
        #signal-content {
            display: none;
            background: transparent; /* Removed black box */
            padding: 0;
            min-width: 150px;
            pointer-events: auto;
        }

        /* Timer Styles */
        .timer-text {
            font-size: 18px;
            color: var(--white);
            font-weight: bold;
            text-shadow: 2px 2px 4px #000, 0 0 10px #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Prediction Text Styles */
        #prediction-text {
            font-size: 42px; 
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        /* Neon Glow Effects */
        .big-style { 
            color: var(--green); 
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.8), 2px 2px 0px #000; 
        }
        .small-style { 
            color: var(--red); 
            text-shadow: 0 0 20px rgba(255, 77, 77, 0.8), 2px 2px 0px #000; 
        }
        
        /* Loading Dots Animation */
        .loading-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            height: 50px; /* Match height of text */
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--yellow);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--yellow);
            animation: pulse 1.5s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { 
                transform: scale(0);
                opacity: 0.5;
            } 
            40% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .urgent { 
            color: #ff4d4d !important; 
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Password Box -->
    <div id="lock-container">
        <div class="label-text">ENTER PIN</div>
        <input type="password" id="passInput" placeholder="•••••" oninput="checkPassword(this.value)" autocomplete="off">
    </div>

    <!-- Signal Display Panel -->
    <div id="signal-content">
        <div class="timer-text"><span id="time-left">30</span>s</div>
        <div id="prediction-text">
            <!-- Content injected via JS -->
        </div>
    </div>
</div>

<script>
    const CYCLE = 30;
    let isUnlocked = false;

    // Function to check user input password
    function checkPassword(val) {
        if(val === "123459") { 
            isUnlocked = true;
            // Hide password container smoothly
            document.getElementById("lock-container").style.display = "none";
            // Show signal container
            document.getElementById("signal-content").style.display = "block";
            
            // Start the signal logic immediately
            updateSignal();
        }
    }

    // Main timer loop
    function updateTick() {
        const now = new Date();
        const seconds = now.getSeconds();
        const remain = CYCLE - (seconds % CYCLE);
        
        const timerDisplay = document.getElementById("time-left");

        if(timerDisplay) {
            // Format timer to show '05' instead of '5'
            timerDisplay.textContent = remain < 10 ? "0" + remain : remain;
            
            // Add urgent visual cue when time is low
            if(remain <= 5) timerDisplay.classList.add("urgent");
            else timerDisplay.classList.remove("urgent");
        }

        // Trigger signal update at the start of a new cycle (30s)
        if (remain === CYCLE && isUnlocked) {
            updateSignal();
        }
    }

    // Function to handle the loading and result display
    function updateSignal() {
        const predText = document.getElementById("prediction-text");
        
        // 1. Start Loading Effect (Three Dots)
        // We create HTML structure for the dots
        predText.innerHTML = `
            <div class="loading-container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;
        
        // 2. Wait 5.5 seconds (5500ms) then show result
        setTimeout(() => {
            // Fade out the dots
            predText.style.opacity = "0";
            predText.style.transform = "scale(0.8)";

            setTimeout(() => {
                // Generate random result
                const result = Math.random() > 0.5 ? "BIG" : "SMALL";
                
                // Set text and apply color style
                predText.textContent = result;
                predText.className = result === "BIG" ? "big-style" : "small-style";
                
                // Fade in the result
                predText.style.opacity = "1";
                predText.style.transform = "scale(1)";
            }, 200); // Short delay for fade out transition

        }, 5500); // 5.5 seconds loading time
    }

    // Run timer every second
    setInterval(updateTick, 1000);
    // Initialize immediately
    updateTick();
</script>
